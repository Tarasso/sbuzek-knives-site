name: Deploy Static Web App

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
      PUBLIC_CATALOG_URL: ${{ vars.PUBLIC_CATALOG_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix api
      - run: npm run build --prefix api

  build_and_deploy:
    needs: validate
    if: vars.AZURE_STATIC_WEB_APPS_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    env:
      PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
      PUBLIC_CATALOG_URL: ${{ vars.PUBLIC_CATALOG_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy Astro site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          api_build_command: "npm run build"
          output_location: "dist"
          app_build_command: "npm run build"

  close_pull_request:
    if: vars.AZURE_STATIC_WEB_APPS_DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close